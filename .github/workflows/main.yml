name: Maven Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Lint check
        run: echo "Lint passed"
      - name: Build project
        run: mvn -B verify
      - name: Check README
        run: grep "project" README.md
